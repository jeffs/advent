<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advent of Code 2015</title>
    <link data-trunk rel="rust">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <style>
      :root {
        color-scheme: light dark;
        --background: light-dark(#ffffff, #16181c);
        --text: light-dark(#1a1a1a, #e6e6e6);
        --link: light-dark(#0b57d0, #8ab4f8);
        --error: light-dark(#b00020, #ff8a80);
        --border: light-dark(#8a8a8a, #6b7078);
      }
      body { background: var(--background); color: var(--text); font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
      a { color: var(--link); }
      textarea, button { background: var(--background); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
      textarea { box-sizing: border-box; font-family: ui-monospace, monospace; width: 100%; }
      button { padding: 0.25rem 0.75rem; }
      .error { color: var(--error); }
      .days { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-top: 1rem; }
      .days a[aria-current="page"] { color: var(--text); font-weight: bold; text-decoration: none; }
      label { display: block; }
      label textarea { display: block; margin-top: 0.5rem; padding: 0.5rem; }
      button { cursor: pointer; font: inherit; }
      dl { column-gap: 1rem; display: grid; grid-template-columns: max-content 1fr; row-gap: 0.25rem; }
      dd { font-family: ui-monospace, monospace; font-weight: bold; margin: 0; }
      select { background: var(--background); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font: inherit; padding: 0.25rem; }
      button:disabled { cursor: default; opacity: 0.5; }
      .elevator { border-top: 1px solid var(--border); margin-top: 2rem; padding-top: 1rem; }
      .controls { align-items: center; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      .controls button { min-height: 2.5rem; min-width: 5rem; }
      .controls select { min-height: 2.5rem; }
      .status { font-variant-numeric: tabular-nums; }
      .strip { display: grid; font-family: ui-monospace, monospace; font-size: 1.25rem; grid-template-columns: 1fr 1.5ch 1fr; line-height: 2rem; white-space: pre; }
      .strip .before { display: flex; justify-content: flex-end; opacity: 0.6; overflow: hidden; }
      .strip .next { background: var(--link); border-radius: 4px; color: var(--background); font-weight: bold; text-align: center; }
      .strip .next:empty { background: none; }
      .strip .after { opacity: 0.6; overflow: hidden; }
      .shaft { border: 1px solid var(--border); border-radius: 4px; margin: 1rem auto 0; max-width: 16rem; }
      .floor { align-items: center; border-bottom: 1px solid var(--border); display: grid; font-variant-numeric: tabular-nums; gap: 0.5rem; grid-template-columns: 4rem 1fr; height: 2rem; padding: 0 0.5rem; }
      .floor:last-child { border-bottom: none; }
      .floor .number { text-align: right; }
      .floor .room { border-radius: 4px; height: 1.25rem; }
      .floor.ground { border-bottom: 3px double var(--text); }
      .floor.car .number { font-weight: bold; }
      .floor.car .room { background: var(--link); }
    </style>
  </head>
  <body></body>
</html>
